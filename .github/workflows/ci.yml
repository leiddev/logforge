name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Linux: two compilers x two build types, plus the oldest Ubuntu still in the
  # runner pool so that a too-new CMake or GCC feature cannot sneak in.
  # ---------------------------------------------------------------------------
  linux:
    name: Linux ${{ matrix.os }} ${{ matrix.cc }} ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, cc: gcc,   cxx: g++,     build_type: Release }
          - { os: ubuntu-24.04, cc: gcc,   cxx: g++,     build_type: Debug }
          - { os: ubuntu-24.04, cc: gcc,   cxx: g++,     build_type: Release }
          - { os: ubuntu-24.04, cc: clang, cxx: clang++, build_type: Debug }
          - { os: ubuntu-24.04, cc: clang, cxx: clang++, build_type: Release }
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgtest-dev

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DLOGFORGE_REQUIRE_TESTS=ON
          -DLOGFORGE_FETCH_GTEST=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

  # ---------------------------------------------------------------------------
  # Windows: MSVC only.  Nothing in this repository is platform specific yet,
  # but the backend has to compile on the same compiler xec ships with, and the
  # /utf-8 and /W4 settings are only exercised here.
  # ---------------------------------------------------------------------------
  windows:
    name: Windows MSVC ${{ matrix.build_type }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -A x64
          -DLOGFORGE_REQUIRE_TESTS=ON
          -DLOGFORGE_FETCH_GTEST=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 4

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --no-tests=error

  # ---------------------------------------------------------------------------
  # Sanitizers: the renderer and the macros write into caller-provided buffers,
  # so an out-of-bounds bug there is exactly the kind that survives review.
  # ---------------------------------------------------------------------------
  sanitize:
    name: Linux clang ASan+UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgtest-dev

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DLOGFORGE_REQUIRE_TESTS=ON
          -DLOGFORGE_FETCH_GTEST=ON

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

  # ---------------------------------------------------------------------------
  # Warnings: a library whose headers are included by other people's code has to
  # be clean at -Wall -Wextra, because those warnings appear in *their* builds.
  # ---------------------------------------------------------------------------
  warnings:
    name: Warnings as errors
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgtest-dev

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=g++
          -DLOGFORGE_WERROR=ON
          -DLOGFORGE_REQUIRE_TESTS=ON
          -DLOGFORGE_FETCH_GTEST=ON

      - name: Build
        run: cmake --build build --parallel 4

  # ---------------------------------------------------------------------------
  # Consumer: install into a scratch prefix and build against it as a stranger
  # would.  This is the job that catches a missing include directory, a wrong
  # EXPORT_NAME or a config file that forgets a dependency.
  # ---------------------------------------------------------------------------
  consumer:
    name: Installed package consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Build and install logforge
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLOGFORGE_BUILD_TESTS=OFF \
            -DLOGFORGE_INSTALL=ON \
            -DCMAKE_INSTALL_PREFIX="$PWD/prefix"
          cmake --build build --parallel 4
          cmake --install build

      - name: Build the consumer
        run: |
          cmake -S tests/consumer -B consumer-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/prefix"
          cmake --build consumer-build --parallel 4

      - name: Run the consumer
        run: ./consumer-build/logforge_consumer
